name: Drift Check

# Unified drift-control gate. Consolidates the repository's fragmented
# drift/parity checks (schema↔types, migration integrity, edge-function↔config
# auth parity, env coverage, permission matrix, DAL boundary, IAP/billing
# parity) behind `npm run drift:check`. Read-only: it detects disagreement
# between sources of truth, it does not mutate the repo.
#
# External parity checks (Stream dashboard, live env presence) SKIP here because
# their secrets are intentionally not exposed to this workflow — the script
# reports them as "skipped (not verified)" rather than falsely passing. To
# actually verify them in CI, map the relevant GitHub secrets into `env:` on the
# "Run unified drift check" step (e.g. SUPABASE_STREAM_API_SECRET,
# STREAM_DASHBOARD_WEBHOOK_SECRET) and the checks will run automatically.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Weekly, mirrors the permission-policy-drift cadence (Mon 09:00 UTC).
    - cron: '0 9 * * 1'

concurrency:
  group: drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift-check:
    name: Unified Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Run unified drift check
        run: npm run drift:check

  edge-function-drift:
    name: Edge Function Drift (deployed vs repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # `supabase functions deploy` only ever adds or updates — it never removes. A function whose
      # source is deleted stays live in production forever: routable, holding its secrets, and no
      # longer reviewable because there is nothing left to read. An audit on 2026-08-05 found 40
      # such orphans, several of them superseded predecessors of functions that had since been
      # hardened. This job makes that gap visible instead of letting it accumulate silently.
      #
      # Follows this workflow's established convention: when the credential is absent the check
      # reports and skips rather than failing, so forks and secret-less runs are not blocked.
      - name: Check deployed vs in-repo edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${PROJECT_REF:-}" ]; then
            echo "skipped (not verified): SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID not available."
            exit 0
          fi
          ./scripts/check-edge-function-drift.sh "$PROJECT_REF"
        # TEMPORARY. The script exits non-zero on drift, and there are currently 40 known orphans,
        # so a blocking job would fail every PR until they are undeployed. Reporting-only until that
        # backlog is cleared; then delete this line so the check actually gates.
        # Undeploy runbook: docs/SCALE_HARDENING_2026-08.md
        continue-on-error: true
