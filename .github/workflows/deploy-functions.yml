name: Deploy Supabase Functions

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function to deploy (or "all" for all functions)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - create-trip
          - join-trip
          - dispatch-notification-deliveries
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy single function
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.function_name != 'all'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy ${{ github.event.inputs.function_name }} --project-ref $PROJECT_ID

      - name: Deploy all functions
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.function_name == 'all')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          # Space-separated function names to skip. Currently empty.
          #
          # `mcp` used to live here: it imported @lovable.dev/mcp-js via `npm:`, and Supabase
          # vendors an npm specifier's whole dependency tarball closure — including esbuild's
          # prebuilt binaries — producing a ~25 MB artifact the deploy endpoint rejected with
          #   unexpected update function status 413: {"message":"request entity too large"}
          # Because `supabase functions deploy` (no args) deploys everything in ONE command, that
          # single 413 aborted the whole run at `mcp` — and functions sort alphabetically, so every
          # function from `mcp` onward (all stream-*, stripe-webhook, revenuecat-webhook,
          # send-email-with-retry, push-notifications, web-push-send, …) silently never deployed.
          # Every run from 2026-07-30 onward failed this way.
          #
          # Two independent fixes, so this can't recur: supabase/functions/mcp/index.ts now imports
          # through esm.sh (which resolves only the real runtime graph, dropping esbuild), and the
          # loop below deploys per function — so any single oversized or broken bundle fails just
          # itself, is named in the job summary, and can no longer mask the other ~130.
          EXCLUDED_FUNCTIONS: ''
        run: |
          set -uo pipefail
          failed=()
          deployed=0
          skipped=()

          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            # `_shared` (and any other underscore-prefixed dir) is library code, not a function.
            case "$fn" in _*) continue ;; esac
            [ -f "$dir/index.ts" ] || continue

            if printf '%s\n' $EXCLUDED_FUNCTIONS | grep -qx "$fn"; then
              skipped+=("$fn")
              continue
            fi

            if supabase functions deploy "$fn" --project-ref "$PROJECT_ID"; then
              deployed=$((deployed+1))
            else
              echo "::error title=Function deploy failed::$fn"
              failed+=("$fn")
            fi
          done

          {
            echo "## Edge function deploy"
            echo "- ✅ deployed: $deployed"
            [ ${#skipped[@]} -gt 0 ] && echo "- ⏭️ skipped (EXCLUDED_FUNCTIONS): ${skipped[*]}"
            [ ${#failed[@]} -gt 0 ] && echo "- ❌ failed: ${failed[*]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#failed[@]} -gt 0 ]; then
            echo "Deploy failed for: ${failed[*]}"
            exit 1
          fi

      - name: Post-deploy health check
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Waiting 5s for functions to initialize..."
          sleep 5
          HTTP_STATUS=$(curl -sf -o /tmp/health-response.json -w '%{http_code}' \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/health" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP 200)"
            cat /tmp/health-response.json | python3 -m json.tool 2>/dev/null || true
          else
            echo "⚠️ Health check returned HTTP $HTTP_STATUS (non-blocking)"
            cat /tmp/health-response.json 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Deployment summary
        run: |
          echo "## Edge Function Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: Chravel Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Function**: ${{ github.event.inputs.function_name || 'triggered by push' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
